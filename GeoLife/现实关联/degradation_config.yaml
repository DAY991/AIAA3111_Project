# Group 16 / 成员 A、B 共用的组合退化协议。路径相对于 final 根目录。
# 修改冻结参数后应创建新协议版本和独立输出目录，不覆盖历史实验。
protocol_version: "1.0.0"
classes: [walk, bike, bus, car, subway]

data:
  points_csv: project/data/processed/points.csv
  reference_manifest: 现实关联/artifacts/reference_manifest.csv

segmentation:
  window_sec: 120
  min_points: 10
  max_gap_sec: 30

split:
  method: leave_one_user_out
  group_column: user_id

degradation:
  # 0 表示原生采样，不将其称为 1s 数据。30s 仅报告不可用边界。
  main_downsample_sec: [0, 5, 10]
  stress_downsample_sec: [30]
  noise_sigma_m: [0, 5, 10, 20]
  downsample_method: first_point_per_time_bucket
  order: downsample_then_noise
  noise_distribution: independent_gaussian_xy
  noise_scale: per_axis_sigma_m
  pairing: noise_seed_window_id_original_point_index

seeds:
  training: 0
  noise_primary: 0
  noise_repeats: [0, 1, 2]
  repeat_conditions: [ds10_n10]
  # 无坐标噪声时推理是确定的，clean 不重复；30s 无 F1 也不重复。

models:
  rf:
    n_estimators: 300
    class_weight: balanced
  gru:
    seq_len: 128
    hidden: 64
    epochs: 15
    batch_size: 512
    lr: 0.001

evaluation:
  primary_metric: macro_f1
  fixed_class_order: true
  zero_division: 0
  # 两模型同窗；另在主网格共同可用窗上评分，以区分选择效应和模型退化。
  report_common_support: true
  report_class_coverage: true
  no_usable_windows_metric: null
